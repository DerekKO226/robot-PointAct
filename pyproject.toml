[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pointact"
version = "0.1.0"
description = "Official implementation of PointAct"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Shizhe Chen", email = "cshizhe@gmail.com" },
]
keywords = ["embodied-ai", "robot-learning", "vision-language-action", "point-cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Hugging Face, LeRobot, and training framework
    "datasets>=2.19.0,<=3.6.0",
    "huggingface-hub[cli]>=1.0.0",
    "lerobot>=0.3.3,<=0.3.4",
    "transformers==5.5.4",
    "accelerate>=1.10.1",

    # Numeric, vision, and point-cloud utilities
    "einops>=0.8.0",
    "numpy==1.26.4",
    "opencv-python-headless>=4.9.0",
    "open3d==0.18.0",
    "av>=14.2.0",
    "scipy",
    "torchvision>=0.21.0",

    # Data formats, CLI, and server-client IPC
    "jsonlines>=4.0.0",
    "lmdb",
    "msgpack",
    "msgpack_numpy",
    "pyzmq",
    "tyro",

    # PyTorch runtime
    "torch==2.7.0",
    "torchcodec>=0.2.1; sys_platform != 'win32' and (sys_platform != 'linux' or (platform_machine != 'aarch64' and platform_machine != 'arm64' and platform_machine != 'armv7l')) and (sys_platform != 'darwin' or platform_machine != 'x86_64')",

    # Model and processor helpers
    "packaging>=24.2",
    "qwen_vl_utils>=0.0.11",
    "timm==1.0.9",
    "ujson>=5.11.0",
    "easydict",
    "addict",  # used by the PTv3 backbones

    # TensorBoard logging for training scripts
    "tensorboardX",
]
# Optional dependencies
[project.optional-dependencies]

# Development
test = ["pytest>=8.1.0", "pytest-timeout>=2.4.0", "pytest-cov>=5.0.0", "mock-serial>=0.0.1 ; sys_platform != 'win32'"]

# All
all = [
    "pointact[test]"
]

# ---------------- Pixi (environment & package management) ----------------
# `pixi install` creates the `pointact` training/server environment in .pixi/.
# LIBERO has its own environment (`libero`, below); RLBench / RoboCASA use conda.
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12.8", glibc = "2.35" },
    { name = "linux-aarch64-cuda", platform = "linux-aarch64", cuda = "12.8", glibc = "2.35" },
]

[tool.pixi.dependencies]
python = "3.10.*"
pip = "*"
ffmpeg = "6.*"
evdev = "*"
ruff = "*"
# CUDA 12.8 toolchain, used to compile CUDA extensions (see the build-cuda-ext task)
cuda-version = "12.8.*"
cuda-nvcc = "*"
cuda-cudart-dev = "*"
cuda-libraries-dev = "*"
cxx-compiler = "*"
ninja = "*"
cmake = "*"

# GB10 (sm_121) needs NVRTC >= 12.9: with 12.8, torch's JIT kernels (e.g. integer prod) fail with
# "nvrtc: invalid value for --gpu-architecture". The aarch64 torch wheel bundles its own CUDA 12.8
# libraries (libnvrtc included) in torch/lib, so a 12.9 NVRTC is installed from PyPI and put first on
# LD_LIBRARY_PATH. The conda toolkit (nvcc, and the NVRTC that cumm links) moves to 12.9 as well.
[tool.pixi.target.linux-aarch64.dependencies]
cuda-version = "12.9.*"

[tool.pixi.target.linux-aarch64.pypi-dependencies]
nvidia-cuda-nvrtc-cu12 = "==12.9.86"

[tool.pixi.target.linux-aarch64.activation.env]
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib/python3.10/site-packages/nvidia/cuda_nvrtc/lib:${LD_LIBRARY_PATH:-}"

[tool.pixi.pypi-dependencies]
pointact = { path = ".", editable = true }
torch = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.22.0", index = "https://download.pytorch.org/whl/cu128" }
triton = { version = "==3.3.0", index = "https://download.pytorch.org/whl/cu128" }
ipython = "*"

# x86_64: prebuilt CUDA extension wheels (torch 2.7 uses the cxx11 ABI).
# aarch64 has no prebuilt wheels: run `pixi run build-cuda-ext` after `pixi install`.
[tool.pixi.target.linux-64.pypi-dependencies]
spconv-cu120 = "==2.3.6"
torch-scatter = { url = "https://data.pyg.org/whl/torch-2.7.0%2Bcu128/torch_scatter-2.1.2%2Bpt27cu128-cp310-cp310-linux_x86_64.whl" }
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3%2Bcu12torch2.7cxx11abiTRUE-cp310-cp310-linux_x86_64.whl" }

[tool.pixi.activation.env]
CUDA_HOME = "$CONDA_PREFIX"
# Root for pretrained weights and experiment outputs used by the training scripts
SCRATCH = "${SCRATCH:-$HOME/scratch}"

[tool.pixi.tasks]
check-env = "python scripts/check_env.py"
build-cuda-ext = "bash scripts/build_cuda_ext.sh"
lint = "ruff check ."
fmt = "ruff format ."

# ---- `libero` environment: LIBERO simulator + evaluation client (no CUDA needed) ----
# Setup: pixi install -e libero && pixi run -e libero setup-libero
[tool.pixi.feature.libero.dependencies]
python = "3.10.*"
pip = "*"
evdev = "*"   # needed by pynput (robosuite dependency)

[tool.pixi.feature.libero.pypi-dependencies]
mujoco = "==3.3.6"   # LIBERO object placements depend on the MuJoCo version
robosuite = "==1.4.1"
bddl = "==1.0.1"
gym = "==0.25.2"
easydict = "*"
future = "*"
pyyaml = "*"
numpy = "==1.26.4"
scipy = "*"
open3d = "==0.18.0"
imageio = { version = "*", extras = ["ffmpeg"] }
opencv-python-headless = "*"
tyro = "*"
einops = "*"
matplotlib = "*"
cloudpickle = "*"
h5py = "*"
tqdm = "*"
termcolor = "*"
msgpack = "*"
msgpack-numpy = "*"
pyzmq = "*"
torch = { version = "==2.7.0", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.libero.activation.env]
MUJOCO_GL = "egl"
PYOPENGL_PLATFORM = "egl"
LIBERO_CONFIG_PATH = "$PIXI_PROJECT_ROOT/.pixi/libero-config"
PYTHONPATH = "$PIXI_PROJECT_ROOT"

[tool.pixi.feature.libero.tasks]
setup-libero = "bash scripts/setup_libero.sh"

[tool.pixi.environments]
libero = { features = ["libero"], no-default-feature = true }

# ---------------- Tool Configurations ----------------
[tool.setuptools.packages.find]
exclude = [
    "*.tests",
    "*.tests.*",
    "tests.*",
    "tests",
    "getting_started*",
    "scripts*",
    "*checkpoints*",
    "outputs*",
    "assets*",
]

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = ["tests/artifacts/**/*.safetensors", "*_pb2.py", "*_pb2_grpc.py", "assets/*", "pointact/qwen2_5_vl/*"]

[tool.ruff.lint]
# E, W: pycodestyle errors and warnings
# F: PyFlakes
# I: isort
# UP: pyupgrade
# B: flake8-bugbear (good practices, potential bugs)
# C4: flake8-comprehensions (more concise comprehensions)
# A: flake8-builtins (shadowing builtins)
# SIM: flake8-simplify
# RUF: Ruff-specific rules
# D: pydocstyle (for docstring style/formatting)
# S: flake8-bandit (some security checks, complements Bandit)
# T20: flake8-print (discourage print statements in production code)
# N: pep8-naming
# TODO: Uncomment rules when ready to use
select = [
    "E", "W", "F", "I", "B", "C4", "T20", "N" # "SIM", "A", "S", "D", "RUF", "UP"
]
ignore = [
    "E501", # Line too long
    "T201", # Print statement found
    "T203", # Pprint statement found
    "B008", # Perform function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pointact"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "experinments",
    "tools",
]
skips = ["B101", "B311", "B404", "B603", "B615"]

[tool.typos]
default.extend-ignore-re = [
    "(?Rm)^.*(#|//)\\s*spellchecker:disable-line$",                      # spellchecker:disable-line
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on", # spellchecker:<on|off>
]
default.extend-ignore-identifiers-re = [
    # Add individual words here to ignore them
    "2nd",
    "pn",
    "ser",
    "ein",
    "thw",
    "THW",
]
